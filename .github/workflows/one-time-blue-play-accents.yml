name: One-time blue play accents

on:
  push:
    paths:
      - '.github/workflows/one-time-blue-play-accents.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested blue accents
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/screens/restaurants_screen.dart')
          text = path.read_text()

          old_surface = 'color: PlayPalette.navySoft,'
          if text.count(old_surface) < 3:
              raise SystemExit('Expected play surface colors were not found')

          # В файле первые три surface-цвета — счётчик ресторанов,
          # кнопка refresh и блок "Oyuna qoşul".
          for _ in range(3):
              text = text.replace(old_surface, 'color: PlayPalette.blue,', 1)

          old_count_text = '''                                  style: const TextStyle(
                                    color: PlayPalette.blue,
                                    fontWeight: FontWeight.w900,
                                  ),'''
          new_count_text = '''                                  style: const TextStyle(
                                    color: Colors.white,
                                    fontWeight: FontWeight.w900,
                                  ),'''
          if old_count_text not in text:
              raise SystemExit('Restaurant count text style was not found')
          text = text.replace(old_count_text, new_count_text, 1)

          path.write_text(text)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/restaurants_screen.dart
          git commit -m 'Use blue for play header controls'
          git push
