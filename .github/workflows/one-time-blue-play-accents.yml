name: One-time blue play accents

on:
  push:
    paths:
      - '.github/workflows/one-time-blue-play-accents.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested blue accents
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/restaurants_screen.dart')
          text = path.read_text()

          old_surface = 'color: PlayPalette.navySoft,'
          if text.count(old_surface) < 3:
              raise SystemExit('Expected play surface colors were not found')

          # Первые три surface-цвета: счётчик ресторанов,
          # кнопка refresh и блок "Oyuna qoşul".
          for _ in range(3):
              text = text.replace(old_surface, 'color: PlayPalette.blue,', 1)

          pattern = r"(child: Text\(\n\s+'\$\{visibleRestaurants\.length\}',\n\s+style: const TextStyle\(\n\s+)color: PlayPalette\.blue,"
          text, count = re.subn(pattern, r"\1color: Colors.white,", text, count=1)
          if count != 1:
              raise SystemExit('Restaurant count text style was not found')

          path.write_text(text)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/restaurants_screen.dart
          git commit -m 'Use blue for play header controls'
          git push
