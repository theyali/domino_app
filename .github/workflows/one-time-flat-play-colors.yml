name: One-time flat play colors

on:
  push:
    paths:
      - .github/workflows/one-time-flat-play-colors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove old play background glows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/restaurants_screen.dart')
          text = path.read_text()

          glow_one = '''            const Positioned(
              top: -130,
              right: -90,
              child: _AmbientGlow(size: 300, color: Color(0x33268CFF)),
            ),
'''
          glow_two = '''            const Positioned(
              top: 340,
              left: -110,
              child: _AmbientGlow(size: 260, color: Color(0x2243D8FF)),
            ),
'''
          for block in (glow_one, glow_two):
              if block not in text:
                  raise SystemExit('Expected ambient glow block not found')
              text = text.replace(block, '', 1)

          start_marker = '\nclass _AmbientGlow extends StatelessWidget {'
          end_marker = '\nclass _HeaderButton extends StatelessWidget {'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Ambient glow class markers not found')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]

          text = text.replace(
              'color: const Color(0x22268CFF),',
              'color: PlayPalette.navySoft,',
          )
          text = text.replace(
              'color: const Color(0x3343B8FF),',
              'color: PlayPalette.blue,',
          )
          text = text.replace(
              'color: const Color(0x558FE6FF),',
              'color: PlayPalette.blue,',
          )

          path.write_text(text)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/restaurants_screen.dart
          git commit -m 'Flatten play screen to requested palette'
          git push
