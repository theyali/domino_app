name: One-time gift shop levels

on:
  push:
    paths:
      - .github/workflows/one-time-gift-shop-levels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch gift shop cards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/restaurant_gift_shop_sheet.dart')
          text = path.read_text()

          old_ratio = '        childAspectRatio: 0.76,'
          if text.count(old_ratio) != 1:
              raise SystemExit(f'ratio matches: {text.count(old_ratio)}')
          text = text.replace(old_ratio, '        childAspectRatio: 0.68,', 1)

          old = '''          const SizedBox(height: 5),
          Container(
            width: double.infinity,
            padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 5),'''
          new = '''          const SizedBox(height: 6),
          Row(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              Container(
                padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 4),
                decoration: BoxDecoration(
                  color: _GiftShopPalette.yellow,
                  borderRadius: BorderRadius.circular(10),
                  border: Border.all(color: _GiftShopPalette.ink, width: 1.6),
                ),
                child: Text(
                  '★ ${gift.level}',
                  style: const TextStyle(
                    color: _GiftShopPalette.ink,
                    fontSize: 10,
                    height: 1,
                    fontWeight: FontWeight.w900,
                  ),
                ),
              ),
              if (gift.isGlobal) ...[
                const SizedBox(width: 5),
                Flexible(
                  child: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 4),
                    decoration: BoxDecoration(
                      color: _GiftShopPalette.skyBlue,
                      borderRadius: BorderRadius.circular(10),
                      border: Border.all(color: _GiftShopPalette.ink, width: 1.6),
                    ),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(
                          Icons.public_rounded,
                          size: 11,
                          color: _GiftShopPalette.ink,
                        ),
                        const SizedBox(width: 3),
                        Flexible(
                          child: Text(
                            context.appLanguage.code == 'az' ? 'hamısı' : 'везде',
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(
                              color: _GiftShopPalette.ink,
                              fontSize: 9,
                              height: 1,
                              fontWeight: FontWeight.w900,
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              ],
            ],
          ),
          const SizedBox(height: 5),
          Container(
            width: double.infinity,
            padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 5),'''
          if text.count(old) != 1:
              raise SystemExit(f'card matches: {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/restaurant_gift_shop_sheet.dart
          git commit -m 'Show gift level and global scope in restaurant shop'
          git push
