name: One-time gift UI patch

on:
  push:
    paths:
      - .github/workflows/one-time-gift-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch
        run: echo '' | base64 -d > /tmp/patch.py
      - name: Apply patch
        run: python3 /tmp/patch.py
      - name: Commit patch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fill avatar frames and show gift levels'
          git push
