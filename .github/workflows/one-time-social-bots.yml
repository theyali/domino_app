name: One-time social and bot UI

on:
  push:
    paths:
      - .github/workflows/one-time-social-bots.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Flutter app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # --------------------------------------------------------------
          # Social API/model: explicit decline + cancel and outgoing list.
          # --------------------------------------------------------------
          replace_once(
              'lib/services/social_service.dart',
              '''  Future<void> acceptFriendRequest(int friendshipId) async {\n    final response = await http.post(\n      ApiConfig.uri('/api/social/friends/$friendshipId/accept/'),\n      headers: await _authJsonHeaders(),\n    );\n    _decode(response);\n  }\n\n  Future<void> removeFriendship(int friendshipId) async {\n''',
              '''  Future<void> acceptFriendRequest(int friendshipId) async {\n    final response = await http.post(\n      ApiConfig.uri('/api/social/friends/$friendshipId/accept/'),\n      headers: await _authJsonHeaders(),\n    );\n    _decode(response);\n  }\n\n  Future<void> declineFriendRequest(int friendshipId) async {\n    final response = await http.post(\n      ApiConfig.uri('/api/social/friends/$friendshipId/decline/'),\n      headers: await _authJsonHeaders(),\n    );\n    _decode(response);\n  }\n\n  Future<void> cancelFriendRequest(int friendshipId) async {\n    final response = await http.post(\n      ApiConfig.uri('/api/social/friends/$friendshipId/cancel/'),\n      headers: await _authJsonHeaders(),\n    );\n    _decode(response);\n  }\n\n  Future<void> removeFriendship(int friendshipId) async {\n''',
          )

          replace_once(
              'lib/models/social.dart',
              '''  final List<SocialUser> friends;\n  final List<FriendRequestItem> incomingRequests;\n  final List<SocialUser> recentPlayers;\n''',
              '''  final List<SocialUser> friends;\n  final List<FriendRequestItem> incomingRequests;\n  final List<FriendRequestItem> outgoingRequests;\n  final List<SocialUser> recentPlayers;\n''',
          )
          replace_once(
              'lib/models/social.dart',
              '''    required this.friends,\n    required this.incomingRequests,\n    required this.recentPlayers,\n''',
              '''    required this.friends,\n    required this.incomingRequests,\n    required this.outgoingRequests,\n    required this.recentPlayers,\n''',
          )
          replace_once(
              'lib/models/social.dart',
              '''      incomingRequests: _parseList(\n        json['incoming_requests'],\n        FriendRequestItem.fromJson,\n      ),\n      recentPlayers: _parseList(json['recent_players'], SocialUser.fromJson),\n''',
              '''      incomingRequests: _parseList(\n        json['incoming_requests'],\n        FriendRequestItem.fromJson,\n      ),\n      outgoingRequests: _parseList(\n        json['outgoing_requests'],\n        FriendRequestItem.fromJson,\n      ),\n      recentPlayers: _parseList(json['recent_players'], SocialUser.fromJson),\n''',
          )

          # Social main screen: decline incoming, show/cancel outgoing.
          replace_once(
              'lib/screens/social_screen.dart',
              '''                () => _service.removeFriendship(request.id),\n''',
              '''                () => _service.declineFriendRequest(request.id),\n''',
          )
          replace_once(
              'lib/screens/social_screen.dart',
              '''          friends: [],\n          incomingRequests: [],\n          recentPlayers: [],\n''',
              '''          friends: [],\n          incomingRequests: [],\n          outgoingRequests: [],\n          recentPlayers: [],\n''',
          )
          replace_once(
              'lib/screens/social_screen.dart',
              '''          const SizedBox(height: 10),\n        ],\n        _SectionHeader(\n          icon: Icons.people_alt_rounded,\n''',
              '''          const SizedBox(height: 10),\n        ],\n        if (overview.outgoingRequests.isNotEmpty) ...[\n          _SectionHeader(\n            icon: Icons.outgoing_mail_rounded,\n            title: _isAz ? 'Göndərilən sorğular' : 'Отправленные заявки',\n            count: overview.outgoingRequests.length,\n            color: _SocialPalette.yellow,\n          ),\n          const SizedBox(height: 10),\n          for (final request in overview.outgoingRequests) ...[\n            _PersonCard(\n              user: request.user,\n              accent: _SocialPalette.yellow,\n              trailing: _MiniAction(\n                icon: Icons.person_remove_alt_1_rounded,\n                color: _SocialPalette.coral,\n                busy: _busyActions.contains('friend-cancel-${request.id}'),\n                onTap: () => _runAction(\n                  'friend-cancel-${request.id}',\n                  () => _service.cancelFriendRequest(request.id),\n                ),\n              ),\n            ),\n            const SizedBox(height: 10),\n          ],\n          const SizedBox(height: 10),\n        ],\n        _SectionHeader(\n          icon: Icons.people_alt_rounded,\n''',
          )
          replace_once(
              'lib/screens/social_screen.dart',
              '''              busy: _busyActions.contains('friend-send-${user.id}'),\n              onMessage: () => _openChat(user),\n''',
              '''              busy: _busyActions.contains('friend-send-${user.id}') ||\n                  (user.friendshipId != null &&\n                      _busyActions.contains('friend-cancel-${user.friendshipId}')),\n              onMessage: () => _openChat(user),\n''',
          )
          replace_once(
              'lib/screens/social_screen.dart',
              '''              onAccept: user.requestIncoming && user.friendshipId != null\n                  ? () => _runAction(\n                        'friend-accept-${user.friendshipId}',\n                        () => _service.acceptFriendRequest(user.friendshipId!),\n                      )\n                  : null,\n''',
              '''              onAccept: user.requestIncoming && user.friendshipId != null\n                  ? () => _runAction(\n                        'friend-accept-${user.friendshipId}',\n                        () => _service.acceptFriendRequest(user.friendshipId!),\n                      )\n                  : null,\n              onCancel: user.requestOutgoing && user.friendshipId != null\n                  ? () => _runAction(\n                        'friend-cancel-${user.friendshipId}',\n                        () => _service.cancelFriendRequest(user.friendshipId!),\n                      )\n                  : null,\n''',
          )
          replace_once(
              'lib/screens/social_screen.dart',
              '''  final VoidCallback onMessage;\n  final VoidCallback? onAddFriend;\n  final VoidCallback? onAccept;\n''',
              '''  final VoidCallback onMessage;\n  final VoidCallback? onAddFriend;\n  final VoidCallback? onAccept;\n  final VoidCallback? onCancel;\n''',
          )
          replace_once(
              'lib/screens/social_screen.dart',
              '''    required this.onMessage,\n    required this.onAddFriend,\n    required this.onAccept,\n  });\n''',
              '''    required this.onMessage,\n    required this.onAddFriend,\n    required this.onAccept,\n    required this.onCancel,\n  });\n''',
          )
          replace_once(
              'lib/screens/social_screen.dart',
              '''          else if (user.requestOutgoing)\n            const _StatusChip(icon: Icons.schedule_rounded, label: '…')\n          else if (onAccept != null)\n''',
              '''          else if (user.requestOutgoing && onCancel != null)\n            _MiniAction(\n              icon: Icons.person_remove_alt_1_rounded,\n              color: _SocialPalette.coral,\n              busy: busy,\n              onTap: onCancel,\n            )\n          else if (user.requestOutgoing)\n            const _StatusChip(icon: Icons.schedule_rounded, label: '…')\n          else if (onAccept != null)\n''',
          )

          # Social management/search: outgoing request becomes cancellable.
          replace_once(
              'lib/screens/social_manage_screen.dart',
              '''    } else if (user.requestOutgoing) {\n      widgets.add(\n        const _ActionIcon(\n          icon: Icons.schedule_rounded,\n          color: _Palette.yellow,\n          onTap: null,\n        ),\n      );\n''',
              '''    } else if (user.requestOutgoing && user.friendshipId != null) {\n      widgets.add(\n        _ActionIcon(\n          icon: Icons.person_remove_alt_1_rounded,\n          color: _Palette.coral,\n          busy: _busy.contains('cancel-${user.friendshipId}'),\n          onTap: () => _run(\n            'cancel-${user.friendshipId}',\n            () => _service.cancelFriendRequest(user.friendshipId!),\n          ),\n        ),\n      );\n''',
          )

          # --------------------------------------------------------------
          # Bot metadata in Flutter models/API.
          # --------------------------------------------------------------
          replace_once(
              'lib/models/game_room.dart',
              '''  final int currentPlayers;\n  final bool isLocked;\n''',
              '''  final int currentPlayers;\n  final int botCount;\n  final bool isLocked;\n''',
          )
          replace_once(
              'lib/models/game_room.dart',
              '''    required this.currentPlayers,\n    required this.isLocked,\n''',
              '''    required this.currentPlayers,\n    required this.botCount,\n    required this.isLocked,\n''',
          )
          replace_once(
              'lib/models/game_room.dart',
              '''      currentPlayers: json['current_players'] as int? ?? playersJson.length,\n      isLocked: json['is_locked'] as bool? ?? false,\n''',
              '''      currentPlayers: json['current_players'] as int? ?? playersJson.length,\n      botCount: json['bot_count'] as int? ?? 0,\n      isLocked: json['is_locked'] as bool? ?? false,\n''',
          )

          replace_once(
              'lib/models/room_player.dart',
              '''  final bool isOwner;\n  final bool isActive;\n''',
              '''  final bool isOwner;\n  final bool isBot;\n  final bool isActive;\n''',
          )
          replace_once(
              'lib/models/room_player.dart',
              '''    required this.isOwner,\n    this.isActive = true,\n''',
              '''    required this.isOwner,\n    this.isBot = false,\n    this.isActive = true,\n''',
          )
          replace_once(
              'lib/models/room_player.dart',
              '''      isOwner: json['is_owner'] as bool? ?? false,\n      isActive: json['is_active'] as bool? ?? true,\n''',
              '''      isOwner: json['is_owner'] as bool? ?? false,\n      isBot: json['is_bot'] as bool? ?? false,\n      isActive: json['is_active'] as bool? ?? true,\n''',
          )

          replace_once(
              'lib/models/multiplayer_game_state.dart',
              '''  final bool isOwner;\n  final bool isActive;\n''',
              '''  final bool isOwner;\n  final bool isBot;\n  final bool isActive;\n''',
          )
          replace_once(
              'lib/models/multiplayer_game_state.dart',
              '''    required this.isOwner,\n    required this.isActive,\n''',
              '''    required this.isOwner,\n    required this.isBot,\n    required this.isActive,\n''',
          )
          replace_once(
              'lib/models/multiplayer_game_state.dart',
              '''      isOwner: json['is_owner'] as bool? ?? false,\n      isActive: json['is_active'] as bool? ?? true,\n''',
              '''      isOwner: json['is_owner'] as bool? ?? false,\n      isBot: json['is_bot'] as bool? ?? false,\n      isActive: json['is_active'] as bool? ?? true,\n''',
          )

          replace_once(
              'lib/services/api_service.dart',
              '''    required int targetScore,\n    String password = '',\n''',
              '''    required int targetScore,\n    int botCount = 0,\n    String password = '',\n''',
          )
          replace_once(
              'lib/services/api_service.dart',
              '''        'target_score': targetScore,\n        'password': password,\n''',
              '''        'target_score': targetScore,\n        'bot_count': botCount,\n        'password': password,\n''',
          )

          # Create-room sheet: simple number of bots from 0 to seats-1.
          replace_once(
              'lib/widgets/create_room_bottom_sheet.dart',
              '''  final int targetScore;\n  final String password;\n''',
              '''  final int targetScore;\n  final int botCount;\n  final String password;\n''',
          )
          replace_once(
              'lib/widgets/create_room_bottom_sheet.dart',
              '''    required this.targetScore,\n    required this.password,\n''',
              '''    required this.targetScore,\n    required this.botCount,\n    required this.password,\n''',
          )
          replace_once(
              'lib/widgets/create_room_bottom_sheet.dart',
              '''  int _maxPlayers = 2;\n  int _targetScore = 101;\n''',
              '''  int _maxPlayers = 2;\n  int _botCount = 0;\n  int _targetScore = 101;\n''',
          )
          replace_once(
              'lib/widgets/create_room_bottom_sheet.dart',
              '''      if (mode == '101') {\n        _maxPlayers = 2;\n        _targetScore = 101;\n''',
              '''      if (mode == '101') {\n        _maxPlayers = 2;\n        if (_botCount > 1) _botCount = 1;\n        _targetScore = 101;\n''',
          )
          replace_once(
              'lib/widgets/create_room_bottom_sheet.dart',
              '''  void _selectTargetScore(int value) {\n''',
              '''  void _selectPlayerCount(int value) {\n    setState(() {\n      _maxPlayers = value;\n      final maxBots = _maxPlayers - 1;\n      if (_botCount > maxBots) _botCount = maxBots;\n    });\n  }\n\n  void _selectTargetScore(int value) {\n''',
          )
          replace_once(
              'lib/widgets/create_room_bottom_sheet.dart',
              '''        targetScore: targetScore,\n        password: _passwordController.text,\n''',
              '''        targetScore: targetScore,\n        botCount: _botCount,\n        password: _passwordController.text,\n''',
          )
          replace_once(
              'lib/widgets/create_room_bottom_sheet.dart',
              '''                          selected: _maxPlayers == count,\n                          onTap: () => setState(() => _maxPlayers = count),\n''',
              '''                          selected: _maxPlayers == count,\n                          onTap: () => _selectPlayerCount(count),\n''',
          )
          replace_once(
              'lib/widgets/create_room_bottom_sheet.dart',
              '''                if (_isPhone) ...[\n                  const SizedBox(height: 22),\n                  _LabelRow(\n                    icon: Icons.emoji_events_rounded,\n''',
              '''                const SizedBox(height: 22),\n                _LabelRow(\n                  icon: Icons.smart_toy_rounded,\n                  color: _CreateRoomPalette.mint,\n                  label: _isAz ? 'Bot sayı' : 'Количество ботов',\n                ),\n                const SizedBox(height: 12),\n                Row(\n                  children: [\n                    for (var count = 0; count < _maxPlayers; count++) ...[\n                      if (count > 0) const SizedBox(width: 10),\n                      Expanded(\n                        child: _PlayerCountButton(\n                          count: count,\n                          selected: _botCount == count,\n                          onTap: () => setState(() => _botCount = count),\n                        ),\n                      ),\n                    ],\n                  ],\n                ),\n                const SizedBox(height: 10),\n                _RuleDescription(\n                  color: _CreateRoomPalette.mint,\n                  text: _isAz\n                      ? '0 — yalnız real oyunçular. Botlar masadakı yerləri dərhal tutur; qalan yerlərə real insanlar qoşula bilər.'\n                      : '0 — только реальные игроки. Боты сразу занимают выбранные места, а на оставшиеся могут зайти реальные люди.',\n                ),\n                if (_isPhone) ...[\n                  const SizedBox(height: 22),\n                  _LabelRow(\n                    icon: Icons.emoji_events_rounded,\n''',
          )

          replace_once(
              'lib/screens/restaurant_room_screen.dart',
              '''        targetScore: request.targetScore,\n        password: request.password,\n''',
              '''        targetScore: request.targetScore,\n        botCount: request.botCount,\n        password: request.password,\n''',
          )

          # Lobby: bots are always ready and visibly marked as bots.
          replace_once(
              'lib/screens/room_lobby_screen.dart',
              '''        activePlayers.every(\n          (player) => player.id == widget.localPlayer.id\n              ? player.isOnline && localRealtimeConnected\n              : player.isOnline,\n        );\n''',
              '''        activePlayers.every(\n          (player) => player.isBot\n              ? true\n              : player.id == widget.localPlayer.id\n                  ? player.isOnline && localRealtimeConnected\n                  : player.isOnline,\n        );\n''',
          )
          replace_once(
              'lib/screens/room_lobby_screen.dart',
              '''                          if (player!.isOwner) context.tr('owner'),\n                          if (isMe) context.tr('you'),\n                          if (!player!.isOwner && !isMe) '#${seatIndex + 1}',\n''',
              '''                          if (player!.isOwner) context.tr('owner'),\n                          if (player!.isBot)\n                            (context.appLanguage.code == 'az' ? 'Bot' : 'Бот'),\n                          if (isMe) context.tr('you'),\n                          if (!player!.isOwner && !player!.isBot && !isMe)\n                            '#${seatIndex + 1}',\n''',
          )
          replace_once(
              'lib/screens/room_lobby_screen.dart',
              '''    final letterColor = GenderStyle.colorFor(\n      current.gender,\n      fallback: _LobbyPalette.ink,\n    );\n''',
              '''    if (current.isBot) {\n      return Container(\n        width: 54,\n        height: 54,\n        decoration: BoxDecoration(\n          color: _LobbyPalette.mint,\n          shape: BoxShape.circle,\n          border: Border.all(color: _LobbyPalette.ink, width: 2.8),\n        ),\n        child: const Icon(\n          Icons.smart_toy_rounded,\n          color: _LobbyPalette.ink,\n          size: 29,\n        ),\n      );\n    }\n\n    final letterColor = GenderStyle.colorFor(\n      current.gender,\n      fallback: _LobbyPalette.ink,\n    );\n''',
          )

          PY

          dart_files=$(git diff --name-only -- '*.dart')
          if [ -n "$dart_files" ]; then
            dart format $dart_files
          fi
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git commit -m 'Add friend request cancellation and bot room settings'
          git push
